# Build CIBMTR Reporting IG with SUSHI + IG Publisher + go-publish,
# deploy to GitHub Pages and commit publication artifacts to deploy-ready branch.
#
# Preview at: https://nmdp-ig.github.io/cibmtr-reporting-ig/
#
# Setup (one-time):
#   Settings > Pages > Source: GitHub Actions
#   Settings > Actions > General > Workflow permissions: Read and write

name: Build & Publish IG

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll
        run: gem install jekyll
        working-directory: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SUSHI
        run: npm install -g fsh-sushi
        working-directory: .

      - name: Run SUSHI
        run: sushi .

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -L -o input-cache/publisher.jar \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar

      # Extract version and canonical from sushi-config.yaml
      - name: Get IG metadata
        id: meta
        run: |
          VERSION=$(grep '^version:' sushi-config.yaml | awk '{print $2}')
          CANONICAL=$(grep '^canonical:' sushi-config.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "canonical=$CANONICAL" >> $GITHUB_OUTPUT
          echo "Building $CANONICAL version $VERSION"

      # Standard build with -publish flag for publication URLs
      - name: Build IG
        run: |
          java -Xmx8g -jar input-cache/publisher.jar publisher \
            -ig ig.ini \
            -publish ${{ steps.meta.outputs.canonical }}/${{ steps.meta.outputs.version }}

      # Clone dependencies for go-publish
      - name: Setup publication dependencies
        working-directory: .
        run: |
          git clone --depth 1 https://github.com/HL7/fhir-ig-history-template.git fhir-ig-history-template
          git clone --depth 1 https://github.com/FHIR/ig-registry.git ig-registry

      # Prepare web-root for publication
      - name: Prepare web-root
        working-directory: .
        run: |
          mkdir -p publication/web-root/cibmtr-reporting

          # Pull existing versioned directories from deploy-ready (preserves old versions)
          git clone --single-branch --branch deploy-ready --depth 1 \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git \
            /tmp/existing-deploy 2>/dev/null || true
          if [ -d /tmp/existing-deploy/publication/web-root/cibmtr-reporting ]; then
            # Copy only versioned directories (0.x.x) from existing deploy
            for dir in /tmp/existing-deploy/publication/web-root/cibmtr-reporting/0.*/; do
              if [ -d "$dir" ]; then
                cp -r "$dir" publication/web-root/cibmtr-reporting/
              fi
            done
          fi

          # Copy history template (provides history.html, history.js, etc.)
          cp -r fhir-ig-history-template/* publication/web-root/cibmtr-reporting/ 2>/dev/null || true
          # Overlay IG output on top (rendered files take precedence over template placeholders)
          cp -r build/output/* publication/web-root/cibmtr-reporting/
          # Copy output to versioned directory
          mkdir -p publication/web-root/cibmtr-reporting/${{ steps.meta.outputs.version }}
          cp -r build/output/* publication/web-root/cibmtr-reporting/${{ steps.meta.outputs.version }}/

      # Run publish-update to generate history and package registry.
      #
      # Three things must line up or IG Publisher's IGWebSiteMaintainer fails
      # (historically swallowed by continue-on-error, producing a single-version,
      # no-history site):
      #
      # 1. -folder must be the WEB ROOT (publication/web-root), NOT the IG dir.
      #    The publisher locates each IG by appending (canonical - website.url) to
      #    -folder. canonical=.../ig/cibmtr-reporting, website.url=.../ig, so it
      #    appends /cibmtr-reporting. Pointing -folder at .../web-root/cibmtr-reporting
      #    doubled it -> .../cibmtr-reporting/cibmtr-reporting/<ver> "not found".
      #    history.html still lands in web-root/cibmtr-reporting/ (the resolved IG dir).
      #
      # 2. -templates must be supplied. It is the dir holding the
      #    header/preamble/postamble.template fragments that fill the
      #    $header$/$preamble$/$postamble$ placeholders in history.template.
      #    Omitting it passes a null templateSrc into HistoryPageUpdater.loadTemplate(),
      #    which throws "First entry in file path cannot be null or empty ... header.template".
      #    Fragments are tracked at publication/web-root/history-templates/.
      #
      # 3. package-list.json must list EXACTLY the version folders present on disk.
      #    Any listed version whose folder is missing -> "path not found" hard fail.
      #    We regenerate the version list from the 0.* dirs actually staged, so it
      #    can never drift from reality.
      - name: Run publish-update
        working-directory: .
        run: |
          WEBROOT=publication/web-root
          IGDIR=$WEBROOT/cibmtr-reporting

          # publish-setup.json goes at the WEB ROOT (describes the site).
          cp build/publish-setup.json $WEBROOT/publish-setup.json

          # package-list.json goes ONLY in the IG dir. If one also sits at the web
          # root, scanForIgs() treats the web root itself as a second IG ("found 2
          # IGs") and fails with a null-path error. Remove any stray root copy.
          rm -f $WEBROOT/package-list.json

          # Source the version list from the fullest available history, then keep
          # only versions whose folder is actually staged on disk:
          #   1. deploy-ready carried-forward list (has ALL published versions), else
          #   2. build/package-list.json (repo default, may lag newest versions).
          SRC=/tmp/existing-deploy/publication/web-root/cibmtr-reporting/package-list.json
          [ -f "$SRC" ] || SRC=build/package-list.json
          echo "Using package-list source: $SRC"
          python3 - "$IGDIR" "$SRC" "$IGDIR/package-list.json" <<'PY'
          import json, os, sys
          igdir, src_path, out_path = sys.argv[1], sys.argv[2], sys.argv[3]
          src = json.load(open(src_path))
          ondisk = {d for d in os.listdir(igdir) if d.startswith("0.") and os.path.isdir(os.path.join(igdir, d))}
          listed = {e.get("version") for e in src["list"]}
          kept = [e for e in src["list"] if e.get("version") == "current" or e.get("version") in ondisk]
          dropped = [e.get("version") for e in src["list"] if e not in kept]
          missing = sorted(ondisk - listed)
          src["list"] = kept
          json.dump(src, open(out_path, "w"), indent=2)
          print("on-disk versions :", sorted(ondisk))
          print("kept in list     :", [e.get("version") for e in kept])
          if dropped: print("dropped (no dir) :", dropped)
          if missing:
              print("::error::versions on disk but missing from package-list source:", missing)
              sys.exit(1)
          PY

          echo "y" | java -Xmx4g -jar build/input-cache/publisher.jar \
            -publish-update \
            -folder "$WEBROOT" \
            -registry ig-registry/fhir-ig-list.json \
            -history fhir-ig-history-template \
            -templates publication/web-root/history-templates
        continue-on-error: true

      # Fail loudly if publish-update did not actually produce the history page.
      # publish-update runs under continue-on-error so a transient issue can't block
      # the deploy, but a MISSING history.html means the publication is broken
      # (single-version, no history) and we want that surfaced, not hidden by a green run.
      - name: Verify history page was generated
        working-directory: .
        run: |
          HIST=publication/web-root/cibmtr-reporting/history.html
          if [ ! -s "$HIST" ]; then
            echo "::error::publish-update did not generate $HIST — history/package registry step failed."
            exit 1
          fi
          echo "history.html generated OK ($(wc -c < "$HIST") bytes)"

      # Apply CIBMTR theme and fix history page JS/CSS
      - name: Apply CIBMTR theme to history page
        working-directory: .
        run: |
          WEBROOT=publication/web-root/cibmtr-reporting

          # Copy CIBMTR CSS to assets-hist so history.html can reference it
          mkdir -p $WEBROOT/assets-hist/css
          cp build/cibmtr-template/content/assets/css/cibmtr.css $WEBROOT/assets-hist/css/cibmtr.css

          if [ -f $WEBROOT/history.html ]; then
            # Inject CIBMTR CSS link
            sed -i 's|</head>|<link href="assets-hist/css/cibmtr.css" rel="stylesheet"/>\n</head>|' $WEBROOT/history.html

            # Download HL7 history JS locally (GitHub Pages CSP blocks external scripts)
            curl -sL -o $WEBROOT/history-cm.js https://hl7.org/fhir/history-cm.js
            curl -sL -o $WEBROOT/history.js https://hl7.org/fhir/history.js
            # Rewrite history.html to use local JS instead of remote HL7 URLs
            sed -i 's|https://hl7.org/fhir/history-cm.js|history-cm.js|g' $WEBROOT/history.html
            sed -i 's|https://hl7.org/fhir/history.js|history.js|g' $WEBROOT/history.html

            # Fix pageJSON: replace the embedded package-list data with the
            # reconciled version list that publish-update used (in the IG dir),
            # NOT build/package-list.json (which can lag the newest versions).
            PAGEJSON=$(cat $WEBROOT/package-list.json | tr -d '\n' | sed "s/'/\\\\'/g")
            sed -i "s|var pageJSON = '.*';|var pageJSON = '${PAGEJSON}';|" $WEBROOT/history.html
          fi

      # Stash publication output before switching branches
      - name: Stash publication output
        working-directory: .
        run: cp -r publication/web-root/cibmtr-reporting /tmp/pub-output

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: |
            build/output/qa.html
            build/output/qa.json
            build/output/qa.txt
          retention-days: 30

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: publication/web-root/cibmtr-reporting/

      # Commit publication artifacts to deploy-ready branch.
      # Only from main: deploy-ready is the stable source consumed by the
      # GitLab Docker build. Feature branches still deploy to the preview
      # Pages site, but must not overwrite deploy-ready.
      - name: Commit to deploy-ready
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Use a fresh clone to avoid any large files from the build
          cd /tmp
          git clone --depth 1 https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git deploy-repo || \
            git init deploy-repo
          cd deploy-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create orphan branch with only publication output
          git checkout --orphan deploy-ready
          git rm -rf . 2>/dev/null || true
          find . -not -path './.git/*' -not -name '.git' -delete 2>/dev/null || true

          mkdir -p publication/web-root
          cp -r /tmp/pub-output publication/web-root/cibmtr-reporting

          git add -A
          git commit -m "Publication build from ${{ github.sha }} (v${{ steps.meta.outputs.version }})"
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git deploy-ready --force

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
